spring:
  application:
    name: maas
  datasource:
    url: jdbc:sqlite:./data/maas.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

maas:
  prediction:
    window-size: 6
    observed-min-sample: 2
    onboarding-sigma: 4
    luteal-phase-days: 14
